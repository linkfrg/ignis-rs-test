[package]
name = "notification_service"
version = "0.1.0"
edition = "2024"

[dependencies]
gdk-pixbuf = "0.21.5"
glib = { version = "0.21.5", features = ["v2_84"]}
serde = "1.0.228"
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "sync"] }
zbus = "5.12.0"
zvariant = { version = "5.8.0", features = ["arrayvec"] }
